# Review each update and its CI; no auto-merge.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    actions-compatible:
      patterns: ['*']
      update-types: [minor, patch]
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    test-tools-compatible:
      patterns: ['pytest', 'ruff', 'build', 'setuptools', 'wheel']
      update-types: [minor, patch]
