name: repository-quality

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check dependency consistency before installation
        run: |
          python -m pip install packaging==26.3 tomli==2.5.0
          python scripts/check_dependency_consistency.py
      - name: Install package
        run: python -m pip install -c requirements-ci.lock -e '.[test]'
      - name: Test
        run: python -m pytest
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Build distributions
        run: python -m build
      - name: Clean wheel install smoke
        run: |
          python -m venv /tmp/gpt-image25-wheel-smoke
          /tmp/gpt-image25-wheel-smoke/bin/python -m pip install --disable-pip-version-check dist/*.whl
          /tmp/gpt-image25-wheel-smoke/bin/python -m pip check
          cd /tmp
          /tmp/gpt-image25-wheel-smoke/bin/gpt-image25-agent "offline wheel smoke" --dry-run --json > /tmp/gpt-image25-wheel-smoke.json
          /tmp/gpt-image25-wheel-smoke/bin/python -c 'import json; data=json.load(open("/tmp/gpt-image25-wheel-smoke.json")); assert data["success"] is True and data["dry_run"] is True'
      - name: Syntax and privacy scan
        run: python scripts/repository_quality.py
